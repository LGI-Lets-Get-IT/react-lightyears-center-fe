upstream backend {
    server lightyearscdc-backend-prod-1:3000;
}

server {
    listen 80;
    server_name localhost;

    # set the root directory for the server (we need to copy our application files here)
    root /usr/share/nginx/html;

    # set the default index file for the server (Angular generates the
    # index.html file for us and it will be in the above directory)
    index index.html;

    # attempt to fix net::ERR_HTTP2_PROTOCOL_ERROR
    # https://stackoverflow.com/questions/58215104/whats-the-neterr-http2-protocol-error-about
    # gzip off;
    # proxy_max_temp_file_size 0;
    
    # Best Practice for gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # gzip_min_length 256;
    # gzip_vary on;

    # Enable maintenance mode if flag exists
    if (-f $document_root/maintenance.enable) {
        rewrite ^(.*)$ /index.html break;
        set $maintenance_mode 1;
    }

    # specify the configuration for the '/' location
    location / {
        # try to serve the requested URI. if that fails then try to
        # serve the URI with a trailing slash. if that fails, then
        # serve the index.html file;
        try_files $uri $uri/ /index.html;

        # If in maintenance mode, force React to render /maintenance
        if ($maintenance_mode) {
            rewrite ^.*$ /maintenance redirect;
        }
    }

    location = /maintenance.enable {
        deny all;
        return 404;
    }

    location /api/ {
        # proxy the request to the backend server
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}