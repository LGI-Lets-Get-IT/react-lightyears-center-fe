upstream backend {
    server lightyearscdc-backend-1:3000;
}

server {
    listen 80;
    # set the root directory for the server (we need to copy our application files here)
    root /usr/share/nginx/html;

    # set the default index file for the server (Angular generates the
    # index.html file for us and it will be in the above directory)
    index index.html;

    # attempt to fix net::ERR_HTTP2_PROTOCOL_ERROR
    # https://stackoverflow.com/questions/58215104/whats-the-neterr-http2-protocol-error-about
    gzip off;
    proxy_max_temp_file_size 0;
    
    # Best Practice for gzip compression
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # gzip_min_length 256;
    # gzip_vary on;

    # specify the configuration for the '/' location
    location / {
        # try to serve the requested URI. if that fails then try to
        # serve the URI with a trailing slash. if that fails, then
        # serve the index.html file;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # proxy the request to the backend server
        proxy_pass http://backend;
        # set the headers for the proxied request
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}