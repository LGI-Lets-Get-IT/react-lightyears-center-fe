name: Docker Image CI

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    branches:
      - main
      - staging
      - development
  workflow_call:

jobs:
  build-development-image:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .env file
      run: |
        echo "${{ secrets.ENV_DEVELOPMENT }}" > .env
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build the Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: Dockerfile.development
        push: true
        tags: ${{ vars.IMAGE_NAME_DEVELOPMENT }}:latest
        build-args: |
          ENV_FILE_PATH=.env
      # run: |
      #   docker build . 
    # - name: Publish docker image to Docker Hub
    #   run: |
    #     docker login -u mrizalrizky -p ${{ secrets.DOCKER_HUB_TOKEN }}
    #     docker push mrizalrizky/lume-pos-backend:latest
  build-staging-image:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .env file
      run: |
        echo "${{ secrets.ENV_STAGING }}" > .env
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build the Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: Dockerfile.staging
        push: true
        # tags: itslgit/lightyearscdc-frontend-staging:latest
        tags: ${{ vars.IMAGE_NAME_STAGING }}:latest
        build-args: |
          ENV_FILE_PATH=.env
  build-production-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .env file
      run: |
        echo "${{ secrets.ENV_PRODUCTION }}" > .env
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build the Docker image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ vars.IMAGE_NAME_PRODUCTION }}:latest
        build-args: |
          ENV_FILE_PATH=.env
